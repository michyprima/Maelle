name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install the GBA library and tools
      # The image has devkitARM already; MiGoomba also needs libgba, and gbafix from gba-tools
      run: dkp-pacman -Sy --noconfirm --needed libgba gba-tools
    - name: Install the DS libraries and tools
      # For Maelle Sync, the DSi app in savesync/dsi: libnds with calico, which drive the DSi's Wi-Fi with WPA2, and the
      # default ARM7 program ndstool puts in the ROM
      run: dkp-pacman -S --noconfirm --needed libnds calico default-arm7 dswifi libfat-nds ndstool
    - name: Compile
      run: make -j$(nproc) VERSION=${{ github.ref_name }}
    - name: Compile the DSi sync app
      run: make -C savesync/dsi -j$(nproc) DEVKITARM=$DEVKITPRO/devkitARM && cp savesync/dsi/maelle-sync.nds .
    - name: Publish
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          maelle.wuhb
          maelle.elf
          maelle-sync.nds
