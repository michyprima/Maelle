name: Automatic Builds

on:
  push:
    branches:
    - master

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install the GBA library and tools
      # The image has devkitARM already; MiGoomba also needs libgba, and gbafix from gba-tools
      run: dkp-pacman -Sy --noconfirm --needed libgba gba-tools
    - name: Compile
      run: make -j$(nproc) VERSION=$(echo $GITHUB_SHA | cut -c1-7)
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: maelle-wiiu
        path: maelle.wuhb
