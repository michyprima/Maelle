name: Automatic Builds

on:
  push:
    branches:
    - master

# A newer push waits for the older one, so the preview release always ends on the latest commit
concurrency:
  group: autobuild
  cancel-in-progress: false

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install the GBA library and tools
      # The image has devkitARM already; MiGoomba also needs libgba, and gbafix from gba-tools
      run: dkp-pacman -Sy --noconfirm --needed libgba gba-tools
    - name: Install the DS libraries and tools
      # For Maelle Sync, the DSi app in savesync/dsi: libnds with calico, which drive the DSi's Wi-Fi with WPA2, and the
      # default ARM7 program ndstool puts in the ROM
      run: dkp-pacman -S --noconfirm --needed libnds calico default-arm7 dswifi libfat-nds ndstool
    - name: Compile
      run: make -j$(nproc) VERSION=$(echo $GITHUB_SHA | cut -c1-7)
    - name: Compile the DSi sync app
      run: make -C savesync/dsi -j$(nproc) DEVKITARM=$DEVKITPRO/devkitARM && cp savesync/dsi/maelle-sync.nds .
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: maelle-wiiu
        path: |
          maelle.wuhb
          maelle.elf
          maelle-sync.nds

  preview:
    needs: build-wiiu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Download
      uses: actions/download-artifact@v4
      with:
        name: maelle-wiiu
    - name: Publish
      # One "preview" pre-release that follows master: the tag is moved to this commit and the files replaced.
      # The tag doesn't start with "v", so the release workflow ignores it.
      run: |
        SHORT=$(echo $GITHUB_SHA | cut -c1-7)
        NOTES="Automatic build of $SHORT ($(date -u +%Y-%m-%d)), replaced on every push to master. Not a stable release."
        gh api -X PATCH repos/$GH_REPO/git/refs/tags/preview -f sha=$GITHUB_SHA -F force=true ||
          gh api repos/$GH_REPO/git/refs -f ref=refs/tags/preview -f sha=$GITHUB_SHA
        if gh release view preview > /dev/null 2>&1; then
          gh release edit preview --prerelease --title "Preview ($SHORT)" --notes "$NOTES"
          gh release upload preview maelle.wuhb maelle.elf maelle-sync.nds --clobber
        else
          gh release create preview maelle.wuhb maelle.elf maelle-sync.nds --prerelease --latest=false --verify-tag \
            --title "Preview ($SHORT)" --notes "$NOTES"
        fi
